
name: Build HT Value Hedge Scanner APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'HTValueHedgeScanner_v1_OneUpload.zip'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Find project or extract one-upload ZIP
        shell: bash
        run: |
          if [ -f HTValueHedgeScanner_v1_OneUpload.zip ]; then
            mkdir -p buildsrc
            unzip -qo HTValueHedgeScanner_v1_OneUpload.zip -d buildsrc
            echo "APP_DIR=buildsrc" >> "$GITHUB_ENV"
          else
            echo "APP_DIR=." >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        run: gradle --no-daemon -p "$APP_DIR" :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTValueHedgeScanner-debug-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  
